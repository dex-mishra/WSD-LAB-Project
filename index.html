<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1c1917" />
    <title>IndusAgri Ops — Plant Companion & 3D Twin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/style.css" />
    <link rel="stylesheet" href="/src/mobile/mobileStyles.css" />
  </head>
  <body>
    <!-- 3D Digital Twin Three.js canvas container -->
    <div id="app"></div>

    <!-- Mobile Application DOM root -->
    <div id="mobile-root" style="display:none;"></div>

    <!-- Boot / title overlay, shown before entering either mode -->
    <div id="boot-overlay">
      <div class="boot-card boot-card-new">
        <div class="boot-brand"><span class="boot-leaf">❧</span> IndusAgri Ops</div>
        <h1>Know your plant<br />at a glance.</h1>
        <p class="boot-sub">Raw → finished counts, machine alerts and voice AI — in a phone-first companion synced with the 3D twin.</p>
        <div class="boot-stats">
          <div class="boot-stat"><b>100→84</b><span>crates today</span></div>
          <div class="boot-stat"><b>88%</b><span>yield</span></div>
          <div class="boot-stat"><b>1</b><span>fault live</span></div>
        </div>
        <div class="boot-actions">
          <button id="btn-start-mobile" class="btn btn-primary btn-big">Open plant app</button>
          <button id="btn-start" class="btn btn-ghost">3D twin</button>
        </div>
        <div class="boot-xr"><span id="xr-status" class="xr-status">Checking VR support…</span></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
